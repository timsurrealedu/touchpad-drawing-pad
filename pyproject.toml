[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchpad-drawing-pad"
version = "0.1.0"
description = "Turn your laptop touchpad into an absolute-position graphics tablet for Krita, GIMP, and Wayland/X11 creative tools."
readme = "README.md"
authors = [
    { name = "Timothy Darmawan", email = "timothy.darmawan@binus.ac.id" }
]
license = { text = "MIT" }
keywords = ["touchpad", "drawing-tablet", "digitizer", "linux", "uinput", "evdev", "wayland", "hyprland", "krita"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
touchpad-tablet = "touchpad_tablet.cli:main"

[project.urls]
Homepage = "https://github.com/timsurrealedu/touchpad-drawing-pad"
Repository = "https://github.com/timsurrealedu/touchpad-drawing-pad"
Issues = "https://github.com/timsurrealedu/touchpad-drawing-pad/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["touchpad_tablet*"]
